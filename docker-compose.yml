services:
  mysql:
    image: mysql:8.0
    env_file:
      - backend/.env
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema_trendlabs.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD" ]
    networks:
      - trendlabs-network
    restart: unless-stopped


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trendlabs-backend
    ports:
      - "8000:8000"
    env_file: backend/.env
    environment:
      - PYTHONPATH=/app
    volumes:
      - ./backend:/app
      - ./backend/storage:/app/storage
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - trendlabs-network
    restart: unless-stopped
    healthcheck:
        test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  mysql_data:
    driver: local
  report_files:
    driver: local
 
networks:
  trendlabs-network:
    driver: bridge
