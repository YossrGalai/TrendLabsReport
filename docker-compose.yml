services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - trendlabs-network
    restart: unless-stopped


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trendlabs-backend
    ports:
      - "8000:8000"
    env_file: backend/.env
    volumes:
      - ./backend:/app
      - report_files:/app/storage
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - trendlabs-network
    restart: unless-stopped
    healthcheck:
        test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
        interval: 10s
        timeout: 5s
        retries: 5
        start_period: 30s

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  mysql_data:
    driver: local
  report_files:
    driver: local
 
networks:
  trendlabs-network:
    driver: bridge
